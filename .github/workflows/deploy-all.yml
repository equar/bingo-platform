name: Deploy Bingo All

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the deployment without changing the remote host
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: bingo-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: bingo-production
    env:
      SERVER: ${{ vars.BINGO_SERVER }}
      BACKEND_SERVICE_NAME: ${{ vars.BINGO_BACKEND_SERVICE_NAME }}
      REMOTE_BACKEND_ROOT: ${{ vars.BINGO_REMOTE_BACKEND_ROOT }}
      REMOTE_ADMIN_ROOT: ${{ vars.BINGO_REMOTE_ADMIN_ROOT }}
      SERVICE_USER: ${{ vars.BINGO_SERVICE_USER }}
      ADMIN_PUBLIC_URL: ${{ vars.BINGO_ADMIN_PUBLIC_URL }}
      DRY_RUN: ${{ inputs.dry_run }}
      BINGO_SSH_KEY_B64: ${{ secrets.BINGO_SSH_KEY_B64 }}
      BINGO_BACKEND_ENV_FILE_B64: ${{ secrets.BINGO_BACKEND_ENV_FILE_B64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bingo-admin/package-lock.json

      - name: Prepare deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          SSH_KEY="$RUNNER_TEMP/bingo-deploy.key"
          BACKEND_ENV_FILE="$RUNNER_TEMP/bingo-backend.env"
          printf 'SSH_KEY=%s\n' "$SSH_KEY" >> "$GITHUB_ENV"
          printf 'BACKEND_ENV_FILE=%s\n' "$BACKEND_ENV_FILE" >> "$GITHUB_ENV"

          if [[ -z "${SERVER:-}" ]]; then
            echo 'ERROR: BINGO_SERVER variable is required.' >&2
            exit 1
          fi

          if [[ -z "${ADMIN_PUBLIC_URL:-}" ]]; then
            echo 'ERROR: BINGO_ADMIN_PUBLIC_URL variable is required.' >&2
            exit 1
          fi

          if [[ -z "${BINGO_SSH_KEY_B64:-}" ]]; then
            echo 'ERROR: BINGO_SSH_KEY_B64 secret is required.' >&2
            exit 1
          fi

          if [[ -z "${BINGO_BACKEND_ENV_FILE_B64:-}" ]]; then
            echo 'ERROR: BINGO_BACKEND_ENV_FILE_B64 secret is required.' >&2
            exit 1
          fi

          printf '%s' "$BINGO_SSH_KEY_B64" | base64 -d > "$SSH_KEY"
          printf '%s' "$BINGO_BACKEND_ENV_FILE_B64" | base64 -d > "$BACKEND_ENV_FILE"
          chmod 600 "$SSH_KEY" "$BACKEND_ENV_FILE"

      - name: Build backend release artifact
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_JAR_PATH="$(${GITHUB_WORKSPACE}/deployment/backend/build-backend.sh)"
          printf 'BACKEND_JAR_PATH=%s\n' "$BACKEND_JAR_PATH" >> "$GITHUB_ENV"

      - name: Build admin release artifact
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_DIST_DIR="$(${GITHUB_WORKSPACE}/deployment/admin/build-admin.sh --api-base-url "$ADMIN_PUBLIC_URL")"
          printf 'ADMIN_DIST_DIR=%s\n' "$ADMIN_DIST_DIR" >> "$GITHUB_ENV"

      - name: Deploy backend and admin releases
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" == "true" ]]; then
            "${GITHUB_WORKSPACE}/deployment/deploy-all.sh" \
              --dry-run \
              --server "$SERVER" \
              --ssh-key "$SSH_KEY" \
              --backend-env-file "$BACKEND_ENV_FILE" \
              --backend-jar "$BACKEND_JAR_PATH" \
              --backend-service-name "${BACKEND_SERVICE_NAME:-bingo-backend}" \
              --remote-backend-root "${REMOTE_BACKEND_ROOT:-/opt/bingo/backend}" \
              --service-user "${SERVICE_USER:-bingo}" \
              --public-url "$ADMIN_PUBLIC_URL" \
              --admin-dist "$ADMIN_DIST_DIR" \
              --remote-admin-root "${REMOTE_ADMIN_ROOT:-/var/www/bingo-admin}"
          else
            "${GITHUB_WORKSPACE}/deployment/deploy-all.sh" \
              --server "$SERVER" \
              --ssh-key "$SSH_KEY" \
              --backend-env-file "$BACKEND_ENV_FILE" \
              --backend-jar "$BACKEND_JAR_PATH" \
              --backend-service-name "${BACKEND_SERVICE_NAME:-bingo-backend}" \
              --remote-backend-root "${REMOTE_BACKEND_ROOT:-/opt/bingo/backend}" \
              --service-user "${SERVICE_USER:-bingo}" \
              --public-url "$ADMIN_PUBLIC_URL" \
              --admin-dist "$ADMIN_DIST_DIR" \
              --remote-admin-root "${REMOTE_ADMIN_ROOT:-/var/www/bingo-admin}"
          fi