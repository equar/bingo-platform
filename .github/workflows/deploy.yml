name: Build and Deploy Bingo

on:
  workflow_dispatch:
    inputs:
      target:
        description: Application to redeploy (also applies changed secrets/variables)
        type: choice
        default: all
        options: [all, backend, frontend, admin, website]
  pull_request:
    types: [closed]
    branches: [develop, release]

permissions:
  contents: read

concurrency:
  group: bingo-deploy-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release')) ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.base.ref == 'develop' ||
      github.event.pull_request.base.ref == 'release'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ (github.event.pull_request.base.ref || github.ref_name) == 'develop' && 'test' || 'production' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ (github.event.pull_request.base.ref || github.ref_name) == 'develop' && 'test' || 'prod' }}
      ALLOW_INSECURE_HTTP: ${{ (github.event.pull_request.base.ref || github.ref_name) == 'develop' && 'true' || 'false' }}
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_DATABASE: ${{ (github.event.pull_request.base.ref || github.ref_name) == 'develop' && 'bingotest' || 'bingo' }}
      SERVER_PORT: ${{ (github.event.pull_request.base.ref || github.ref_name) == 'develop' && '8091' || '8081' }}
      MYSQL_SSL_MODE: ${{ (github.event.pull_request.base.ref || github.ref_name) == 'develop' && 'DISABLED' || 'VERIFY_IDENTITY' }}
      MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL: ${{ (github.event.pull_request.base.ref || github.ref_name) == 'develop' && 'true' || 'false' }}
      JAVA_TOOL_OPTIONS: ${{ (github.event.pull_request.base.ref || github.ref_name) == 'develop' && '-Xms128m -Xmx384m' || '-Xms512m -Xmx1g' }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
      SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
      MICROSOFT_GRAPH_TENANT_ID: ${{ secrets.MICROSOFT_GRAPH_TENANT_ID }}
      MICROSOFT_GRAPH_CLIENT_ID: ${{ secrets.MICROSOFT_GRAPH_CLIENT_ID }}
      MICROSOFT_GRAPH_CLIENT_SECRET: ${{ secrets.MICROSOFT_GRAPH_CLIENT_SECRET }}
      APP_EMAIL_PROVIDER: ${{ vars.APP_EMAIL_PROVIDER }}
      APP_EMAIL_FROM: ${{ vars.APP_EMAIL_FROM }}
      BINGO_FLOAT_BANK_ENCRYPTION_KEY: ${{ secrets.BINGO_FLOAT_BANK_ENCRYPTION_KEY }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
      MYSQL_HOST: ${{ (github.event.pull_request.base.ref || github.ref_name) == 'develop' && '127.0.0.1' || vars.MYSQL_HOST }}
      MYSQL_USER: ${{ vars.MYSQL_USER }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      WEBSOCKET_ALLOWED_ORIGINS: ${{ vars.WEBSOCKET_ALLOWED_ORIGINS }}
      ADMIN_ACCOUNT_ACTIVATION_URL: ${{ vars.ADMIN_ACCOUNT_ACTIVATION_URL }}
      ADMIN_BOOTSTRAP_ENABLED: ${{ vars.ADMIN_BOOTSTRAP_ENABLED || 'false' }}
      ADMIN_EMAIL_BOOTSTRAP_ENABLED: ${{ vars.ADMIN_EMAIL_BOOTSTRAP_ENABLED || ((github.event.pull_request.base.ref || github.ref_name) == 'develop' && 'false' || 'true') }}
      ADMIN_BOOTSTRAP_EMAILS: ${{ vars.ADMIN_BOOTSTRAP_EMAILS || ((github.event.pull_request.base.ref || github.ref_name) == 'develop' && 'test@example.invalid' || 'apps@bakaroo.com,equarhishe@gmail.com') }}
      ADMIN_BOOTSTRAP_PHONE: ${{ vars.ADMIN_BOOTSTRAP_PHONE }}
      ADMIN_BOOTSTRAP_NAME: ${{ vars.ADMIN_BOOTSTRAP_NAME }}
      ADMIN_BOOTSTRAP_EMAIL: ${{ vars.ADMIN_BOOTSTRAP_EMAIL }}
      SPRING_MAIL_HOST: ${{ vars.SPRING_MAIL_HOST }}
      SPRING_MAIL_PORT: ${{ vars.SPRING_MAIL_PORT }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      ADMIN_PUBLIC_URL: ${{ vars.ADMIN_PUBLIC_URL }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_SITE_INDEXABLE: ${{ vars.PUBLIC_SITE_INDEXABLE }}
      PUBLIC_ANDROID_AVAILABILITY: ${{ vars.PUBLIC_ANDROID_AVAILABILITY }}
      PUBLIC_ANDROID_URL: ${{ vars.PUBLIC_ANDROID_URL }}
      PUBLIC_IOS_AVAILABILITY: ${{ vars.PUBLIC_IOS_AVAILABILITY }}
      PUBLIC_IOS_URL: ${{ vars.PUBLIC_IOS_URL }}
      PUBLIC_SUPPORT_EMAIL: ${{ vars.PUBLIC_SUPPORT_EMAIL }}
      PUBLIC_SUPPORT_TELEGRAM_URL: ${{ vars.PUBLIC_SUPPORT_TELEGRAM_URL }}
      PUBLIC_SUPPORT_WHATSAPP_URL: ${{ vars.PUBLIC_SUPPORT_WHATSAPP_URL }}
      APP_PAYMENT_PROVIDER_NAME: ${{ vars.APP_PAYMENT_PROVIDER_NAME }}
      APP_PAYMENT_BUSINESS_ACCOUNT: ${{ vars.APP_PAYMENT_BUSINESS_ACCOUNT }}
      APP_PAYMENT_INSTRUCTIONS: ${{ vars.APP_PAYMENT_INSTRUCTIONS }}
      APP_GAME_PAYOUTS_ENABLED: ${{ (github.event.pull_request.base.ref || github.ref_name) == 'develop' && 'false' || vars.APP_GAME_PAYOUTS_ENABLED || 'false' }}
    steps:
      - name: Checkout merged branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 2
      - name: Detect affected applications
        id: changes
        env:
          DEPLOY_TARGET: ${{ inputs.target || 'auto' }}
        run: python3 deployment/aws/detect-deployment-changes.py --target "$DEPLOY_TARGET"
      - name: Set up Java
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: bingo-backend/pom.xml
      - name: Set up Node.js
        if: steps.changes.outputs.admin == 'true' || steps.changes.outputs.website == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: |
            bingo-admin/package-lock.json
            bingo-website/package-lock.json
      - name: Validate deployment configuration
        if: steps.changes.outputs.any == 'true'
        run: python3 deployment/aws/validate-config.py
      - name: Build backend
        if: steps.changes.outputs.backend == 'true'
        working-directory: bingo-backend
        shell: bash
        run: |
          set -uo pipefail
          log_file="$RUNNER_TEMP/bingo-maven-build.log"
          for attempt in 1 2 3 4; do
            echo "Maven build attempt ${attempt}/4"
            if mvn -B -Dmaven.test.skip=true clean package >"$log_file" 2>&1; then
              cat "$log_file"
              exit 0
            else
              status=$?
            fi
            cat "$log_file"
            if ! grep -Eqi 'HTTP Status: 429|status code: 429|Too Many Requests' "$log_file"; then
              exit "$status"
            fi
            if [[ "$attempt" -eq 4 ]]; then
              echo '::error::Maven Central kept returning HTTP 429 after four attempts.'
              exit "$status"
            fi
            delay=$((15 * (2 ** (attempt - 1))))
            echo "Maven Central rate limited this build; retrying in ${delay}s."
            sleep "$delay"
          done
      - name: Build admin
        if: steps.changes.outputs.admin == 'true'
        working-directory: bingo-admin
        run: |
          npm ci
          npm run build
      - name: Build public website
        if: steps.changes.outputs.website == 'true'
        working-directory: bingo-website
        run: |
          npm ci
          npm run check
          npm run validate:links
          npm run build
      - name: Configure SSH
        if: steps.changes.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : "${DEPLOY_HOST:?Configure DEPLOY_HOST in the selected GitHub Environment}"
          : "${DEPLOY_USER:?Configure DEPLOY_USER in the selected GitHub Environment}"
          : "${DEPLOY_SSH_KEY_B64:?Configure DEPLOY_SSH_KEY_B64 in the selected GitHub Environment}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          mkdir -p "$HOME/.ssh"
          key="$RUNNER_TEMP/bingo-aws.pem"
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > "$key"
          tr -d '\r' < "$key" > "$key.tmp"
          # OpenSSH private keys require a terminating newline.
          if [[ -s "$key.tmp" && "$(tail -c 1 "$key.tmp" | wc -l)" -eq 0 ]]; then
            printf '\n' >> "$key.tmp"
          fi
          mv "$key.tmp" "$key"
          chmod 600 "$key"
          if ! ssh-keygen -y -P '' -f "$key" >/dev/null 2>&1; then
            echo '::error::Invalid SSH private key or unsupported passphrase. Set DEPLOY_SSH_KEY_B64 to the Base64 encoding of the complete, unencrypted deployment private key file.'
            exit 1
          fi
          ssh-keyscan -T 20 -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          printf 'SSH_KEY=%s\nSERVER=%s@%s\n' "$key" "$DEPLOY_USER" "$DEPLOY_HOST" >> "$GITHUB_ENV"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -i "$key" "$DEPLOY_USER@$DEPLOY_HOST" true
      - name: Deploy backend
        if: steps.changes.outputs.backend == 'true'
        run: bash deployment/aws/deploy-backend.sh
      - name: Deploy admin and public website
        if: steps.changes.outputs.admin == 'true' || steps.changes.outputs.website == 'true'
        env:
          FRONTEND_TARGET: ${{ steps.changes.outputs.frontend_target }}
        run: bash deployment/aws/deploy-frontend.sh "$FRONTEND_TARGET"
      - name: Remove deployment key
        if: always()
        run: rm -f "$RUNNER_TEMP/bingo-aws.pem" "$RUNNER_TEMP/bingo-aws.pem.tmp"
