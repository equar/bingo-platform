name: Flutter Apps CI

on:
  pull_request:
    paths:
      - bingo-player/**
      - bingo-agent/**
      - .github/workflows/bingo-player-mobile-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bingo-player-mobile-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.app }} on Flutter ${{ matrix.flutter_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        app: [bingo-player, bingo-agent]
        flutter_version: ['3.41.0', '3.47.7']
    env:
      MOBILE_API_BASE_URL: https://api.example.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff
        with:
          flutter-version: ${{ matrix.flutter_version }}
          channel: stable

      - name: Validate Flutter app
        run: node ../scripts/ci/run-component-checks.mjs mobile --ci --app "${{ matrix.app }}" --flutter-version "${{ matrix.flutter_version }}"
