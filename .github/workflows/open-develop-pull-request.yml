name: Open working branch PR to develop

on:
  push:
    branches:
      - '**'
      - '!develop'
      - '!release'
      - '!main'

permissions:
  contents: read

concurrency:
  group: open-develop-pr-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pull-request:
    if: github.repository == 'equar/bingo-platform' && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check GitHub App configuration
        env:
          APP_ID: ${{ vars.BINGO_PR_AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BINGO_PR_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "GitHub App setup is incomplete. Configure repository variable BINGO_PR_AUTOMATION_APP_ID and secret BINGO_PR_AUTOMATION_APP_PRIVATE_KEY, then install the App on equar/bingo-platform with Contents: read and Pull requests: write permissions."
            exit 1
          fi

      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BINGO_PR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.BINGO_PR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: bingo-platform
          permission-contents: read
          permission-pull-requests: write

      - name: Check out the automation from the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Open pull request when changes are proposed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/ci/open-develop-pull-request.mjs
