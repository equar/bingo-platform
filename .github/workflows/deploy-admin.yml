name: Deploy Bingo Admin

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the deployment without changing the remote host
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: bingo-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: bingo-admin-production
    env:
      SERVER: ${{ vars.BINGO_SERVER }}
      SSH_KEY: ${{ runner.temp }}/bingo-admin-deploy.key
      REMOTE_ADMIN_ROOT: ${{ vars.BINGO_REMOTE_ADMIN_ROOT }}
      SERVICE_USER: ${{ vars.BINGO_SERVICE_USER }}
      ADMIN_PUBLIC_URL: ${{ vars.BINGO_ADMIN_PUBLIC_URL }}
      DRY_RUN: ${{ inputs.dry_run }}
      BINGO_SSH_KEY_B64: ${{ secrets.BINGO_SSH_KEY_B64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bingo-admin/package-lock.json

      - name: Prepare deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "${SERVER:-}" ]]; then
            echo 'ERROR: BINGO_SERVER variable is required.' >&2
            exit 1
          fi

          if [[ -z "${ADMIN_PUBLIC_URL:-}" ]]; then
            echo 'ERROR: BINGO_ADMIN_PUBLIC_URL variable is required.' >&2
            exit 1
          fi

          if [[ -z "${BINGO_SSH_KEY_B64:-}" ]]; then
            echo 'ERROR: BINGO_SSH_KEY_B64 secret is required.' >&2
            exit 1
          fi

          printf '%s' "$BINGO_SSH_KEY_B64" | base64 -d > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

      - name: Build admin release artifact
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_DIST_DIR="$(${GITHUB_WORKSPACE}/deployment/admin/build-admin.sh --api-base-url "$ADMIN_PUBLIC_URL")"
          printf 'ADMIN_DIST_DIR=%s\n' "$ADMIN_DIST_DIR" >> "$GITHUB_ENV"

      - name: Deploy admin release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DRY_RUN}" == "true" ]]; then
            "${GITHUB_WORKSPACE}/deployment/admin/deploy-admin.sh" \
              --dry-run \
              --server "$SERVER" \
              --ssh-key "$SSH_KEY" \
              --public-url "$ADMIN_PUBLIC_URL" \
              --admin-dist "$ADMIN_DIST_DIR"
          else
            "${GITHUB_WORKSPACE}/deployment/admin/deploy-admin.sh" \
              --server "$SERVER" \
              --ssh-key "$SSH_KEY" \
              --public-url "$ADMIN_PUBLIC_URL" \
              --admin-dist "$ADMIN_DIST_DIR"
          fi