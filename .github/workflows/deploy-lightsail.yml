name: Deploy Bingo to Lightsail

on:
  workflow_dispatch:
    inputs:
      component:
        description: Application component to deploy after all checks pass
        type: choice
        required: true
        default: all
        options:
          - all
          - backend
          - admin
          - website
      dry_run:
        description: Build and test without changing AWS or the Lightsail instance
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: bingo-lightsail-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: bingo-lightsail-production
    permissions:
      contents: read
      id-token: write
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bingo_qa_test
          MYSQL_USER: bingo_test
          MYSQL_PASSWORD: bingo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      AWS_REGION: ${{ vars.BINGO_AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.BINGO_AWS_ROLE_ARN }}
      LIGHTSAIL_INSTANCE_NAME: ${{ vars.BINGO_LIGHTSAIL_INSTANCE_NAME }}
      LIGHTSAIL_DATABASE_RESOURCE_NAME: ${{ vars.BINGO_LIGHTSAIL_DATABASE_RESOURCE_NAME }}
      DATABASE_NAME: ${{ vars.BINGO_DATABASE_NAME }}
      BACKEND_RUNTIME_SECRET_ARN: ${{ vars.BINGO_BACKEND_RUNTIME_SECRET_ARN }}
      DATABASE_ADMIN_SECRET_ARN: ${{ vars.BINGO_DATABASE_ADMIN_SECRET_ARN }}
      SITE_URL: ${{ vars.BINGO_PUBLIC_SITE_URL }}
      SITE_INDEXABLE: ${{ vars.BINGO_PUBLIC_SITE_INDEXABLE }}
      ADMIN_URL: ${{ vars.BINGO_ADMIN_URL }}
      API_BASE_URL: ${{ vars.BINGO_ADMIN_API_BASE_URL }}
      TLS_EMAIL: ${{ vars.BINGO_TLS_EMAIL }}
      PUBLIC_ANDROID_AVAILABILITY: ${{ vars.BINGO_PUBLIC_ANDROID_AVAILABILITY }}
      PUBLIC_ANDROID_URL: ${{ vars.BINGO_PUBLIC_ANDROID_URL }}
      PUBLIC_IOS_AVAILABILITY: ${{ vars.BINGO_PUBLIC_IOS_AVAILABILITY }}
      PUBLIC_IOS_URL: ${{ vars.BINGO_PUBLIC_IOS_URL }}
      PUBLIC_SUPPORT_EMAIL: ${{ vars.BINGO_PUBLIC_SUPPORT_EMAIL }}
      PUBLIC_SUPPORT_TELEGRAM_URL: ${{ vars.BINGO_PUBLIC_SUPPORT_TELEGRAM_URL }}
      PUBLIC_SUPPORT_WHATSAPP_URL: ${{ vars.BINGO_PUBLIC_SUPPORT_WHATSAPP_URL }}
      DRY_RUN: ${{ inputs.dry_run }}
      COMPONENT: ${{ inputs.component }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          for name in SITE_URL ADMIN_URL API_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: Configure the matching GitHub Environment variable for ${name}." >&2
              exit 1
            fi
          done

          if [[ "${SITE_INDEXABLE:-}" != "true" && "${SITE_INDEXABLE:-}" != "false" ]]; then
            echo 'ERROR: BINGO_PUBLIC_SITE_INDEXABLE must be exactly true or false.' >&2
            exit 1
          fi

          node <<'NODE'
          for (const name of ['SITE_URL', 'ADMIN_URL', 'API_BASE_URL']) {
            const value = process.env[name];
            const url = new URL(value);
            if (url.protocol !== 'https:' || value !== url.origin || url.username || url.password ||
                url.search || url.hash ||
                ['localhost', '127.0.0.1', '::1'].includes(url.hostname)) {
              throw new Error(`${name} must be an HTTPS public origin without a path.`);
            }
          }
          const hosts = ['SITE_URL', 'ADMIN_URL', 'API_BASE_URL']
            .map(name => new URL(process.env[name]).hostname);
          if (new Set(hosts).size !== hosts.length) {
            throw new Error('Website, admin, and API must use three distinct hostnames.');
          }
          if (process.env.DRY_RUN === 'false' &&
              !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(process.env.TLS_EMAIL || '')) {
            throw new Error('BINGO_TLS_EMAIL must be a valid email address for a real deployment.');
          }
          NODE

          if [[ "${DRY_RUN}" == "false" ]]; then
            for name in AWS_REGION AWS_ROLE_ARN LIGHTSAIL_INSTANCE_NAME TLS_EMAIL; do
              if [[ -z "${!name:-}" ]]; then
                echo "ERROR: Configure the matching required GitHub Environment variable for ${name}." >&2
                exit 1
              fi
            done
            if [[ "${COMPONENT}" == "all" || "${COMPONENT}" == "backend" ]]; then
              for name in BACKEND_RUNTIME_SECRET_ARN DATABASE_ADMIN_SECRET_ARN LIGHTSAIL_DATABASE_RESOURCE_NAME DATABASE_NAME; do
                if [[ -z "${!name:-}" ]]; then
                  echo "ERROR: Configure the matching GitHub Environment variable for ${name}." >&2
                  exit 1
                fi
              done
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify backend against MySQL
        working-directory: bingo-backend
        env:
          SPRING_PROFILES_ACTIVE: test
          BINGO_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/bingo_qa_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          BINGO_TEST_MYSQL_USERNAME: bingo_test
          BINGO_TEST_MYSQL_PASSWORD: bingo_test
        run: mvn -B verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install, lint, test, typecheck, and build admin
        working-directory: bingo-admin
        env:
          VITE_API_BASE_URL: ${{ vars.BINGO_ADMIN_API_BASE_URL }}
        run: |
          npm ci
          npm run lint
          npm test
          npx tsc -b --pretty false
          npm run build

      - name: Install, check, validate links, and build website
        working-directory: bingo-website
        env:
          PUBLIC_SITE_URL: ${{ vars.BINGO_PUBLIC_SITE_URL }}
          PUBLIC_SITE_INDEXABLE: ${{ vars.BINGO_PUBLIC_SITE_INDEXABLE }}
          PUBLIC_ANDROID_AVAILABILITY: ${{ vars.BINGO_PUBLIC_ANDROID_AVAILABILITY }}
          PUBLIC_ANDROID_URL: ${{ vars.BINGO_PUBLIC_ANDROID_URL }}
          PUBLIC_IOS_AVAILABILITY: ${{ vars.BINGO_PUBLIC_IOS_AVAILABILITY }}
          PUBLIC_IOS_URL: ${{ vars.BINGO_PUBLIC_IOS_URL }}
          PUBLIC_SUPPORT_EMAIL: ${{ vars.BINGO_PUBLIC_SUPPORT_EMAIL }}
          PUBLIC_SUPPORT_TELEGRAM_URL: ${{ vars.BINGO_PUBLIC_SUPPORT_TELEGRAM_URL }}
          PUBLIC_SUPPORT_WHATSAPP_URL: ${{ vars.BINGO_PUBLIC_SUPPORT_WHATSAPP_URL }}
        run: |
          npm ci
          npm run check
          npm run validate:links
          npm run build

      - name: Validate website production metadata
        env:
          PUBLIC_SITE_URL: ${{ vars.BINGO_PUBLIC_SITE_URL }}
          PUBLIC_SITE_INDEXABLE: ${{ vars.BINGO_PUBLIC_SITE_INDEXABLE }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('bingo-website/dist/index.html', 'utf8');
          const canonical = new URL('/', process.env.PUBLIC_SITE_URL).toString();
          const robots = process.env.PUBLIC_SITE_INDEXABLE === 'true'
            ? 'index,follow'
            : 'noindex,nofollow';
          if (!html.includes(`<link rel="canonical" href="${canonical}"`)) {
            throw new Error(`Expected production canonical URL was not emitted: ${canonical}`);
          }
          if (!html.includes(`<meta name="robots" content="${robots}"`)) {
            throw new Error(`Expected robots setting was not emitted: ${robots}`);
          }
          NODE

      - name: Configure AWS credentials with GitHub OIDC
        if: ${{ inputs.dry_run == false }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BINGO_AWS_ROLE_ARN }}
          aws-region: ${{ vars.BINGO_AWS_REGION }}

      - name: Prepare Lightsail release and deploy
        if: ${{ inputs.dry_run == false }}
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077

          release_id="${GITHUB_SHA:0:12}-${GITHUB_RUN_ATTEMPT}"
          bundle_dir="$RUNNER_TEMP/bingo-lightsail-$release_id"
          archive="$RUNNER_TEMP/bingo-lightsail-$release_id.tar.gz"
          access_json="$RUNNER_TEMP/lightsail-access-$release_id.json"
          private_key="$RUNNER_TEMP/lightsail-$release_id.pem"
          known_hosts="$RUNNER_TEMP/lightsail-known-hosts-$release_id"
          REMOTE_HOST=""
          REMOTE_USER=""
          opened_port=false
          remote_files_ready=false
          RUNNER_IP=""

          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$remote_files_ready" == "true" ]]; then
              if ! ssh -i "$private_key" -o ConnectTimeout=5 -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes \
                "$REMOTE_USER@$REMOTE_HOST" \
                "sudo rm -f /tmp/bingo-deploy-$release_id.sh /tmp/bingo-release-$release_id.tar.gz" \
                >/dev/null 2>&1; then
                echo 'ERROR: Could not remove temporary deployment files from the Lightsail host.' >&2
                status=1
              fi
            fi
            if [[ "$opened_port" == "true" ]]; then
              if aws lightsail close-instance-public-ports \
                --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
                --port-info "$PORT_INFO" >"$RUNNER_TEMP/lightsail-close-port-$release_id.json" 2>"$RUNNER_TEMP/lightsail-close-port-$release_id.err"; then
                closed_port=false
                for attempt in $(seq 1 18); do
                  if aws lightsail get-instance \
                    --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
                    --query instance.networking.ports \
                    --output json >"$RUNNER_TEMP/lightsail-ports-$release_id.json" &&
                    jq -e --arg cidr "$RUNNER_IP/32" \
                      'all(.[]; .fromPort != 22 or .toPort != 22 or .protocol != "tcp" or ((.cidrs // []) | index($cidr) == null))' \
                      "$RUNNER_TEMP/lightsail-ports-$release_id.json" >/dev/null; then
                    closed_port=true
                    break
                  fi
                  sleep 5
                done
                if [[ "$closed_port" != "true" ]]; then
                  echo 'ERROR: The temporary SSH firewall rule is still present. Close TCP port 22 for this runner CIDR in Lightsail immediately.' >&2
                  status=1
                fi
              else
                echo 'ERROR: Could not close the temporary SSH firewall rule. Close TCP port 22 for this runner CIDR in Lightsail immediately.' >&2
                cat "$RUNNER_TEMP/lightsail-close-port-$release_id.err" >&2
                status=1
              fi
            fi
            rm -f "$private_key" "$access_json" "$known_hosts" "$archive"
            rm -rf "$bundle_dir"
            exit "$status"
          }
          trap cleanup EXIT

          mkdir -p "$bundle_dir"
          mkdir -p "$bundle_dir/website" "$bundle_dir/admin"
          cp -a bingo-website/dist/. "$bundle_dir/website/"
          cp -a bingo-admin/dist/. "$bundle_dir/admin/"
          cp deployment/lightsail/nginx-sites.conf.template "$bundle_dir/nginx-sites.conf.template"

          if [[ "$COMPONENT" == "all" || "$COMPONENT" == "backend" ]]; then
            mkdir -p "$bundle_dir/backend"
            backend_jar="$(find bingo-backend/target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*.jar' | sort | head -n 1)"
            if [[ -z "$backend_jar" ]]; then
              echo 'ERROR: Maven verify did not produce the backend JAR.' >&2
              exit 1
            fi
            cp "$backend_jar" "$bundle_dir/backend/backend.jar"
            aws secretsmanager get-secret-value \
              --secret-id "$BACKEND_RUNTIME_SECRET_ARN" \
              --query SecretString \
              --output text > "$bundle_dir/backend/runtime-settings.env"
            aws secretsmanager get-secret-value \
              --secret-id "$DATABASE_ADMIN_SECRET_ARN" \
              --query SecretString \
              --output text > "$bundle_dir/backend/database-admin.json"
            chmod 600 "$bundle_dir/backend/runtime-settings.env" "$bundle_dir/backend/database-admin.json"
            database_host="$(aws lightsail get-relational-database \
              --relational-database-name "$LIGHTSAIL_DATABASE_RESOURCE_NAME" \
              --query relationalDatabase.masterEndpoint.address \
              --output text)"
            if [[ -z "$database_host" || "$database_host" == "None" ]]; then
              echo 'ERROR: Lightsail did not return the managed database endpoint.' >&2
              exit 1
            fi
            if grep -Eq '^[[:space:]]*(MYSQL_HOST|MYSQL_PORT|MYSQL_DATABASE)=' "$bundle_dir/backend/runtime-settings.env"; then
              echo 'ERROR: Remove MYSQL_HOST, MYSQL_PORT, and MYSQL_DATABASE from the backend runtime secret; the workflow supplies the managed Lightsail database connection.' >&2
              exit 1
            fi
            database_name="$DATABASE_NAME"
            node - "$database_name" <<'NODE'
            const name = process.argv[2];
            if (!/^[A-Za-z][A-Za-z0-9_]{0,63}$/.test(name)) {
              throw new Error('BINGO_LIGHTSAIL_DATABASE_NAME must be a valid MySQL database name.');
            }
          NODE
            printf '\nMYSQL_HOST=%s\nMYSQL_PORT=3306\nMYSQL_DATABASE=%s\n' \
              "$database_host" "$database_name" >> "$bundle_dir/backend/runtime-settings.env"
            mv "$bundle_dir/backend/runtime-settings.env" "$bundle_dir/backend/backend.env"
            if ! jq -e '(.username | type == "string" and length > 0) and (.password | type == "string" and length > 0)' \
              "$bundle_dir/backend/database-admin.json" >/dev/null; then
              echo 'ERROR: Database admin secret must be a JSON object with username and password keys.' >&2
              exit 1
            fi
            for key in MYSQL_USER MYSQL_PASSWORD JWT_SECRET CORS_ALLOWED_ORIGINS WEBSOCKET_ALLOWED_ORIGINS ADMIN_ACCOUNT_ACTIVATION_URL SPRING_MAIL_USERNAME SPRING_MAIL_PASSWORD; do
              if ! grep -Eq "^[[:space:]]*$key=" "$bundle_dir/backend/backend.env"; then
                echo "ERROR: Backend runtime secret is missing required setting ${key}." >&2
                exit 1
              fi
            done
          fi

          tar -czf "$archive" -C "$bundle_dir" .

          access_details="$(aws lightsail get-instance-access-details \
            --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
            --protocol ssh \
            --output json)"
          printf '%s' "$access_details" > "$access_json"
          chmod 600 "$access_json"
          jq -er '.accessDetails.privateKey' "$access_json" > "$private_key"
          chmod 600 "$private_key"
          REMOTE_HOST="$(jq -er '.accessDetails.ipAddress' "$access_json")"
          REMOTE_USER="$(jq -er '.accessDetails.username' "$access_json")"
          host_key="$(jq -er '.accessDetails.hostKeys[0].publicKey' "$access_json")"
          printf '%s %s\n' "$REMOTE_HOST" "$host_key" > "$known_hosts"
          chmod 600 "$known_hosts"
          ssh-keygen -y -f "$private_key" >/dev/null

          runner_ip="$(curl --fail --silent --show-error https://checkip.amazonaws.com | tr -d '\r\n')"
          python3 - "$runner_ip" <<'PY'
          import ipaddress
          import sys
          ipaddress.IPv4Address(sys.argv[1])
          PY
          PORT_INFO="$(jq -cn --arg cidr "$runner_ip/32" \
            '{protocol:"tcp",fromPort:22,toPort:22,cidrs:[$cidr]}')"
          opened_port=true
          aws lightsail open-instance-public-ports \
            --instance-name "$LIGHTSAIL_INSTANCE_NAME" \
            --port-info "$PORT_INFO" > "$RUNNER_TEMP/lightsail-open-port-$release_id.json"

          connected=false
          for attempt in $(seq 1 18); do
            if ssh -i "$private_key" -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=5 "$REMOTE_USER@$REMOTE_HOST" true; then
              connected=true
              break
            fi
            sleep 5
          done
          if [[ "$connected" != "true" ]]; then
            echo 'ERROR: Could not connect to the Lightsail instance using its temporary SSH access details.' >&2
            exit 1
          fi

          remote_archive="/tmp/bingo-release-$release_id.tar.gz"
          remote_script="/tmp/bingo-deploy-$release_id.sh"
          scp -i "$private_key" -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes \
            "$archive" "$REMOTE_USER@$REMOTE_HOST:$remote_archive"
          remote_files_ready=true
          scp -i "$private_key" -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes \
            deployment/lightsail/deploy-release.sh "$REMOTE_USER@$REMOTE_HOST:$remote_script"
          ssh -i "$private_key" -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes \
            "$REMOTE_USER@$REMOTE_HOST" "chmod 600 $remote_archive $remote_script"

          site_host="$(node -p 'new URL(process.env.SITE_URL).hostname')"
          admin_host="$(node -p 'new URL(process.env.ADMIN_URL).hostname')"
          api_host="$(node -p 'new URL(process.env.API_BASE_URL).hostname')"
          printf -v q_component '%q' "$COMPONENT"
          printf -v q_release '%q' "$release_id"
          printf -v q_site '%q' "$SITE_URL"
          printf -v q_admin '%q' "$ADMIN_URL"
          printf -v q_api '%q' "$API_BASE_URL"
          printf -v q_email '%q' "$TLS_EMAIL"
          printf -v q_archive '%q' "$remote_archive"
          ssh -i "$private_key" -o UserKnownHostsFile="$known_hosts" -o StrictHostKeyChecking=yes \
            "$REMOTE_USER@$REMOTE_HOST" \
            "sudo -n bash $remote_script $q_component $q_release $q_site $q_admin $q_api $q_email $q_archive"

          if [[ "$COMPONENT" == "all" || "$COMPONENT" == "website" ]]; then
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
              --output /dev/null "$SITE_URL/"
          fi
          if [[ "$COMPONENT" == "all" || "$COMPONENT" == "admin" ]]; then
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
              --output /dev/null "$ADMIN_URL/"
          fi
          if [[ "$COMPONENT" == "all" || "$COMPONENT" == "backend" ]]; then
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
              --output /dev/null "$API_BASE_URL/actuator/health"
          fi

      - name: Report build-only dry run
        if: ${{ inputs.dry_run }}
        run: echo "All application checks and builds passed. No AWS credentials were assumed and no Lightsail resources were changed."
