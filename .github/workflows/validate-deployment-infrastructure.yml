name: Validate AWS infrastructure

on:
  pull_request:
    paths:
      - deployment/aws/**
      - deployment/mobile/prepare-store-credentials.py
      - deployment/mobile/test_prepare_store_credentials.py
      - deployment/mobile/release_provenance.py
      - deployment/mobile/test_release_provenance.py
      - deployment/mobile/test_fastlane_release_policy.rb
      - deployment/terraform/**
      - .github/workflows/deploy.yml
      - .github/workflows/branch-flow-guard.yml
      - .github/workflows/pr-validation-pipeline.yml
      - .github/workflows/bingo-player-android-internal-testing.yml
      - .github/workflows/bingo-player-android-production.yml
      - .github/workflows/bingo-player-ios-testflight.yml
      - .github/workflows/bingo-player-ios-app-store.yml
      - .github/workflows/validate-deployment-infrastructure.yml
      - .github/BRANCH-AND-DEPLOYMENT-POLICY.md
      - bingo-player/fastlane/Fastfile
      - bingo-player/tooling/validate_release_api_base_url.sh
      - scripts/ci/run-component-checks.mjs
      - scripts/ci/validate-github-workflows.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform and deployment scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive deployment/terraform
          terraform -chdir=deployment/terraform init -backend=false -input=false
          terraform -chdir=deployment/terraform validate
          terraform -chdir=deployment/terraform/test-database init -backend=false -input=false
          terraform -chdir=deployment/terraform/test-database validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow YAML validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Lint infrastructure and deployment scripts
        run: node scripts/ci/run-component-checks.mjs infrastructure --ci

      - name: Validate rendered Nginx configuration
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nginx gettext-base openssl
          sudo install -d -m 0755 /etc/letsencrypt/live/bingo-platform
          sudo openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /etc/letsencrypt/live/bingo-platform/privkey.pem \
            -out /etc/letsencrypt/live/bingo-platform/fullchain.pem \
            -subj '/CN=example.com' -days 1
          env SITE_DOMAIN=example.com ADMIN_DOMAIN=admin.example.com API_DOMAIN=api.example.com API_PORT=8081 \
            envsubst '${SITE_DOMAIN} ${ADMIN_DOMAIN} ${API_DOMAIN} ${API_PORT}' \
            < deployment/aws/nginx-bingo.conf.template \
            | sudo tee /etc/nginx/sites-available/bingo.conf >/dev/null
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sfn /etc/nginx/sites-available/bingo.conf /etc/nginx/sites-enabled/bingo.conf
          sudo nginx -t
          env SITE_DOMAIN=test.example.com ADMIN_DOMAIN=admin.test.example.com API_DOMAIN=api.test.example.com \
            envsubst '${SITE_DOMAIN} ${ADMIN_DOMAIN} ${API_DOMAIN}' \
            < deployment/terraform/templates/test-nginx-http.conf.tftpl \
            | sudo tee /etc/nginx/sites-available/bingo.conf >/dev/null
          sudo nginx -t
