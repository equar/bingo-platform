name: Bingo Player Android Production Promotion

on:
  workflow_dispatch:
    inputs:
      android_version_code:
        description: Android versionCode to promote to production
        type: string
        required: true
      android_production_rollout:
        description: Initial rollout fraction for production promotion
        type: string
        required: false
        default: "0.10"
      release_notes:
        description: Release notes for the production rollout
        type: string
        required: false
        default: Production promotion release
      source_workflow_run_id:
        description: Successful main-branch Android internal-testing run that uploaded this build
        type: string
        required: true
      confirm_production:
        description: Required to request an Android production promotion from main
        type: boolean
        required: true
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: bingo-player-android-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote the tested Android build to production
    if: github.repository == 'equar/bingo-platform' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: bingo-app-android-production
    defaults:
      run:
        shell: bash
        working-directory: bingo-player
    env:
      MOBILE_API_BASE_URL: https://api.bingo.bakaroo.com
      ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME }}
      ANDROID_VERSION_CODE: ${{ inputs.android_version_code }}
      ANDROID_PRODUCTION_ROLLOUT: ${{ inputs.android_production_rollout }}
      SOURCE_WORKFLOW_RUN_ID: ${{ inputs.source_workflow_run_id }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate release backend URL
        run: ./tooling/validate_release_api_base_url.sh "$MOBILE_API_BASE_URL"

      - name: Download Android build provenance
        uses: actions/download-artifact@v4
        with:
          name: bingo-android-release-provenance
          run-id: ${{ inputs.source_workflow_run_id }}
          github-token: ${{ github.token }}
          path: bingo-player/release-provenance

      - name: Verify the selected build targets production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ../deployment/mobile/release_provenance.py verify \
            --manifest release-provenance/bingo-release-provenance.json \
            --platform android \
            --build-number "$ANDROID_VERSION_CODE" \
            --application-id "$ANDROID_PACKAGE_NAME" \
            --source-run-id "$SOURCE_WORKFLOW_RUN_ID" \
            --source-workflow-path .github/workflows/bingo-player-android-internal-testing.yml \
            --source-branch main

      - name: Prepare Google Play credentials
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "${ANDROID_VERSION_CODE:-}" ]]; then
            echo 'ERROR: android_version_code is required.' >&2
            exit 1
          fi

          python3 ../deployment/mobile/prepare-store-credentials.py play

      - name: Install Fastlane
        run: sudo gem install fastlane -v 2.241.1 --no-document

      - name: Promote the build to production
        run: fastlane android promote_production
