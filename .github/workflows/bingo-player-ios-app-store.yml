name: Bingo Player iOS App Store Submission

on:
  workflow_dispatch:
    inputs:
      ios_build_number:
        description: Processed iOS build number to submit for review
        type: string
        required: true
      ios_app_version:
        description: Marketing version of the processed iOS build
        type: string
        required: true
      release_notes:
        description: Release notes for the App Store submission
        type: string
        required: false
        default: App Store submission release
      source_workflow_run_id:
        description: Successful release-branch TestFlight run that uploaded this build
        type: string
        required: true
      ios_automatic_release:
        description: Release automatically after App Review approval
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: bingo-player-ios-app-store
  cancel-in-progress: false

jobs:
  submit:
    name: Submit the processed iOS build for App Store review
    if: github.ref == 'refs/heads/release'
    runs-on: macos-14
    timeout-minutes: 45
    environment: bingo-app-ios-production
    defaults:
      run:
        shell: bash
        working-directory: bingo-player
    env:
      MOBILE_API_BASE_URL: https://api.bingo.bakaroo.com
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_BUILD_NUMBER: ${{ inputs.ios_build_number }}
      IOS_APP_VERSION: ${{ inputs.ios_app_version }}
      SOURCE_WORKFLOW_RUN_ID: ${{ inputs.source_workflow_run_id }}
      IOS_AUTOMATIC_RELEASE: ${{ inputs.ios_automatic_release }}
      APPSTORE_DEPLOYER_KEY: ${{ secrets.APPSTORE_DEPLOYER_KEY }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff
        with:
          flutter-version: 3.47.7
          channel: stable

      - name: Validate release backend URL
        run: ./tooling/validate_release_api_base_url.sh "$MOBILE_API_BASE_URL"

      - name: Download iOS build provenance
        uses: actions/download-artifact@v4
        with:
          name: bingo-ios-release-provenance
          run-id: ${{ inputs.source_workflow_run_id }}
          github-token: ${{ github.token }}
          path: bingo-player/release-provenance

      - name: Verify the selected build targets production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ../deployment/mobile/release_provenance.py verify \
            --manifest release-provenance/bingo-release-provenance.json \
            --platform ios \
            --build-number "$IOS_BUILD_NUMBER" \
            --app-version "$IOS_APP_VERSION" \
            --application-id "$IOS_BUNDLE_ID" \
            --source-run-id "$SOURCE_WORKFLOW_RUN_ID" \
            --source-workflow-path .github/workflows/bingo-player-ios-testflight.yml \
            --source-branch release

      - name: Fail fast when the iOS project is missing
        run: |
          set -euo pipefail
          if [[ ! -d ios/Runner.xcodeproj ]]; then
            echo 'ERROR: ios/Runner.xcodeproj is missing. Restore the iOS project before running this workflow.' >&2
            exit 1
          fi

      - name: Prepare App Store Connect key
        run: |
          set -euo pipefail
          umask 077
          python3 ../deployment/mobile/prepare-store-credentials.py appstore

      - name: Install Fastlane
        run: sudo gem install fastlane -v 2.241.1 --no-document

      - name: Submit the build for review
        run: fastlane ios app_store_submission
