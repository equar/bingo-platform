name: Bingo Player iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes for TestFlight
        type: string
        required: false
        default: TestFlight release
      mobile_api_base_url:
        description: Internal test API URL; HTTP is allowed only for api.test.bakaroo.com
        type: string
        required: true
        default: http://api.test.bakaroo.com

permissions:
  contents: read

concurrency:
  group: bingo-player-ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build, sign, and upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: bingo-player
    env:
      MOBILE_API_BASE_URL: ${{ inputs.mobile_api_base_url }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      APPSTORE_DEPLOYER_KEY: ${{ secrets.APPSTORE_DEPLOYER_KEY }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.BINGO_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.BINGO_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.BINGO_IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.BINGO_IOS_KEYCHAIN_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff
        with:
          flutter-version: 3.47.7
          channel: stable

      - name: Validate release backend URL
        run: ./tooling/validate_release_api_base_url.sh "$MOBILE_API_BASE_URL" --allow-test-http

      - name: Fail fast when the iOS project is missing
        run: |
          set -euo pipefail
          if [[ ! -d ios/Runner.xcodeproj ]]; then
            echo 'ERROR: ios/Runner.xcodeproj is missing. Restore the iOS project before running this workflow.' >&2
            exit 1
          fi

      - name: Prepare iOS signing assets
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "${IOS_DISTRIBUTION_CERTIFICATE_BASE64:-}" || -z "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:-}" || -z "${IOS_PROVISIONING_PROFILE_BASE64:-}" || -z "${IOS_KEYCHAIN_PASSWORD:-}" ]]; then
            echo 'ERROR: iOS signing secrets are required.' >&2
            exit 1
          fi

          KEYCHAIN_NAME="bingo-build.keychain-db"
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"
          CERTIFICATE_PATH="$RUNNER_TEMP/bingo-distribution-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/bingo-profile.mobileprovision"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -d > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"
          python3 ../deployment/mobile/prepare-store-credentials.py appstore

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/bingo.mobileprovision"

          printf 'IOS_IPA_PATH=%s\n' "$PWD/build/ios/ipa" >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build the iOS IPA
        run: |
          set -euo pipefail
          RELEASE_BUILD_NUMBER="$(python3 ../deployment/mobile/release_provenance.py build-number --pubspec pubspec.yaml)"
          RELEASE_APP_VERSION="$(python3 ../deployment/mobile/release_provenance.py app-version --pubspec pubspec.yaml)"
          echo "RELEASE_BUILD_NUMBER=$RELEASE_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_APP_VERSION=$RELEASE_APP_VERSION" >> "$GITHUB_ENV"
          flutter build ipa --release --build-name="$RELEASE_APP_VERSION" --build-number="$RELEASE_BUILD_NUMBER" --dart-define=API_BASE_URL="${MOBILE_API_BASE_URL}" --dart-define=BINGO_TEST_ALLOW_INSECURE_HTTP=true

      - name: Capture the built IPA path
        run: |
          set -euo pipefail
          IPA_FILE_PATH="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_FILE_PATH" ]]; then
            echo 'ERROR: No IPA was produced by flutter build ipa.' >&2
            exit 1
          fi
          printf 'IOS_IPA_PATH=%s\n' "$PWD/$IPA_FILE_PATH" >> "$GITHUB_ENV"

      - name: Write iOS release provenance
        run: |
          python3 ../deployment/mobile/release_provenance.py write \
            --platform ios \
            --build-number "$RELEASE_BUILD_NUMBER" \
            --app-version "$RELEASE_APP_VERSION" \
            --application-id "$IOS_BUNDLE_ID" \
            --api-base-url "$MOBILE_API_BASE_URL" \
            --output "$RUNNER_TEMP/bingo-release-provenance.json"

      - name: Install Fastlane
        run: sudo gem install fastlane -v 2.241.1 --no-document

      - name: Upload to TestFlight
        run: fastlane ios testflight

      - name: Store iOS release provenance
        uses: actions/upload-artifact@v4
        with:
          name: bingo-ios-release-provenance
          path: ${{ runner.temp }}/bingo-release-provenance.json
          if-no-files-found: error
          retention-days: 90
