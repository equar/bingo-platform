spring:
  datasource:
    url: ${BINGO_TEST_MYSQL_URL:}
    username: ${BINGO_TEST_MYSQL_USERNAME:}
    password: ${BINGO_TEST_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

app:
  security:
    jwt:
      secret: test-secret-key-test-secret-key-test-secret-key
      access-token-ttl-seconds: 3600
