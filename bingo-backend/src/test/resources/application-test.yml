spring:
  datasource:
    url: jdbc:h2:mem:bingo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true

app:
  security:
    jwt:
      secret: test-secret-key-test-secret-key-test-secret-key
      access-token-ttl-seconds: 3600
