spring:
  datasource:
    url: ${BINGO_MAVEN_MYSQL_URL:}
    username: ${BINGO_MAVEN_MYSQL_USERNAME:}
    password: ${BINGO_MAVEN_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

app:
  qa:
    test-runtime-identity-reporting-enabled: false
    synthetic-financial-tests-enabled: ${BINGO_MAVEN_SYNTHETIC_FINANCIAL_TESTS_ENABLED:false}
  wallet:
    signup-reward-test-posting-enabled: ${BINGO_MAVEN_SYNTHETIC_FINANCIAL_TESTS_ENABLED:false}
    deposit-simulation-enabled: ${BINGO_MAVEN_SYNTHETIC_FINANCIAL_TESTS_ENABLED:false}
    adjustment-simulation-enabled: ${BINGO_MAVEN_SYNTHETIC_FINANCIAL_TESTS_ENABLED:false}
  agent:
    float-simulation-enabled: ${BINGO_MAVEN_SYNTHETIC_FINANCIAL_TESTS_ENABLED:false}
    bank-account-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  security:
    jwt:
      secret: test-secret-key-test-secret-key-test-secret-key
      access-token-ttl-seconds: 3600
