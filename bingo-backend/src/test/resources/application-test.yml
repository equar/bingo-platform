spring:
  datasource:
    url: ${BINGO_MAVEN_MYSQL_URL:}
    username: ${BINGO_MAVEN_MYSQL_USERNAME:}
    password: ${BINGO_MAVEN_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

app:
  qa:
    test-runtime-identity-reporting-enabled: false
  wallet:
    signup-reward-test-posting-enabled: true
    deposit-simulation-enabled: true
    adjustment-simulation-enabled: true
  agent:
    float-simulation-enabled: true
    bank-account-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  security:
    jwt:
      secret: test-secret-key-test-secret-key-test-secret-key
      access-token-ttl-seconds: 3600
