spring:
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.bakaroo.bingo.backend: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:OFF}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:OFF}
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}
    json:
      add:
        service: bingo-backend
        environment: production
      stacktrace:
        max-length: 8192
        max-throwable-depth: 12

app:
  wallet:
    deposit-simulation-enabled: false
    adjustment-simulation-enabled: false
  agent:
    float-simulation-enabled: false
    bank-account-encryption-key: ${BINGO_FLOAT_BANK_ENCRYPTION_KEY:}
  admin-account-email:
    activation-url: ${ADMIN_ACCOUNT_ACTIVATION_URL}
  dev:
    seed-enabled: false
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
