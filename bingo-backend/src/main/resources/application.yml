spring:
  application:
    name: bingo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bingo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  flyway:
    enabled: true
  config:
    import: optional:file:.env[.properties]
  main:
    allow-bean-definition-overriding: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:kirshipay@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,env,beans
  endpoint:
    health:
      show-details: never
    env:
      show-values: never
  health:
    mail:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  business-timezone: ${APP_BUSINESS_TIMEZONE:Africa/Addis_Ababa}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
    authentication:
      account-attempt-limit: ${APP_AUTH_ACCOUNT_ATTEMPT_LIMIT:5}
      network-attempt-limit: ${APP_AUTH_NETWORK_ATTEMPT_LIMIT:50}
      window: ${APP_AUTH_ATTEMPT_WINDOW:PT15M}
      lockout: ${APP_AUTH_LOCKOUT:PT15M}
      trusted-proxy-addresses: ${APP_AUTH_TRUSTED_PROXY_ADDRESSES:127.0.0.1,::1}
  wallet:
    currency: ${APP_WALLET_CURRENCY:ETB}
    deposit-simulation-enabled: false
    adjustment-simulation-enabled: false
    deposit-conversion-rate: ${APP_WALLET_DEPOSIT_CONVERSION_RATE:1.000000}
    payment-provider-name: ${APP_PAYMENT_PROVIDER_NAME:Telebirr}
    business-account: ${APP_PAYMENT_BUSINESS_ACCOUNT:}
    payment-instructions: ${APP_PAYMENT_INSTRUCTIONS:Submit the telebirr reference after payment for manual verification.}
  game:
    max-tickets-per-player: ${APP_GAME_MAX_TICKETS_PER_PLAYER:10}
    session-capacity: ${APP_GAME_SESSION_CAPACITY:1000}
    ticket-sales-close-on-session-start: ${APP_GAME_TICKET_SALES_CLOSE_ON_SESSION_START:true}
    draw-interval: ${APP_GAME_DRAW_INTERVAL:PT10S}
  agent:
    pin-reconfirm-threshold: ${APP_AGENT_PIN_RECONFIRM_THRESHOLD:1000.00}
    login-attempt-limit: ${APP_AGENT_LOGIN_ATTEMPT_LIMIT:5}
    pin-attempt-limit: ${APP_AGENT_PIN_ATTEMPT_LIMIT:5}
    payout-code-attempt-limit: ${APP_AGENT_PAYOUT_CODE_ATTEMPT_LIMIT:5}
    attempt-window: ${APP_AGENT_ATTEMPT_WINDOW:PT15M}
