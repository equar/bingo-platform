spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bingo?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:kirshiuser}
    password: ${SPRING_DATASOURCE_PASSWORD:replace-with-local-db-password}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

app:
  dev:
    seed-enabled: true
  security:
    jwt:
      secret: ${JWT_SECRET:replace-with-local-jwt-secret}
