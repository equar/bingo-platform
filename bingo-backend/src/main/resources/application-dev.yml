spring:
  mail:
    host: ${DEV_SMTP_HOST:localhost}
    port: ${DEV_SMTP_PORT:1025}
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          ssl:
            enable: false
          connectiontimeout: ${DEV_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${DEV_SMTP_READ_TIMEOUT:5000}
          writetimeout: ${DEV_SMTP_WRITE_TIMEOUT:5000}
  datasource:
    url: jdbc:mysql://localhost:3306/bingo?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

app:
  email:
    from: ${APP_EMAIL_FROM:no-reply@bingo.local}
  dev:
    seed-enabled: ${APP_DEV_SEED_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5180,http://127.0.0.1:5180,http://localhost:5181,http://127.0.0.1:5181}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5180,http://127.0.0.1:5180,http://localhost:5181,http://127.0.0.1:5181}
