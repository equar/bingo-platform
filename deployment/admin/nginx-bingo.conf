server {
    listen 80;
    server_name bingo.example.com;

    # Redirect plain HTTP to HTTPS once TLS is enabled.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bingo.example.com;

    ssl_certificate     /etc/letsencrypt/live/bingo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bingo.example.com/privkey.pem;

    access_log /var/log/nginx/bingo_access.log;
    error_log  /var/log/nginx/bingo_error.log;

    root /var/www/bingo-admin/current;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
